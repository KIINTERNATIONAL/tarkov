<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TARKOV OPS">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>TARKOV OPS · 임무 맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f3f4f2; --line:#d9dcd6; --line2:#b9beb5;
  --text:#111111; --dim:#333333; --faint:#555555;
  --khaki:#d9b44a; --khaki2:#8a6a12; --accent:#6b4f00; --ok:#1d7a35; --warn:#a85a00; --bad:#c62828;
  --me:#0a5fb4; --pal:#b54a00; --sel:#fff6dc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:420px 1fr;height:100vh;height:100dvh}
#panel{grid-column:1;grid-row:1;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:500}
#mapwrap{grid-column:2;grid-row:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#e9ebe7}

.hdr{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;color:#111}
.brand h1 span{color:var(--accent);font-family:"IBM Plex Sans KR";font-weight:700;font-size:16px;letter-spacing:0;margin-left:6px}
.gear{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer;color:#111;font-size:14px}
.gear:hover{border-color:#111}
.who{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.who label{font-size:14px;color:var(--dim);font-weight:600}
.sync{font-size:13px;color:var(--faint);margin-left:auto;white-space:nowrap;font-weight:600}
.sync.ok{color:var(--ok)} .sync.local{color:var(--warn)} .sync.bad{color:var(--bad)}
.src{font-size:12.5px;color:var(--faint);margin-top:6px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px}
.seg button{background:none;border:0;padding:6px 13px;border-radius:6px;cursor:pointer;font-size:14px;color:#222;font-weight:500}
.seg button.on{background:#111;color:#fff;font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}

.tools{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.search{position:relative}
.search input{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:8px;padding:10px 36px 10px 12px;color:#111;font:inherit;font-size:15.5px;outline:none}
.search input::placeholder{color:#777}
.search input:focus{border-color:#111}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#444;cursor:pointer;font-size:17px;padding:4px 6px;display:none}
.frow{display:flex;gap:6px;flex-wrap:wrap}
select{background:#fff;border:1.5px solid var(--line2);color:#111;border-radius:7px;padding:7px 8px;font:inherit;font-size:14px;outline:none;flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:#222;cursor:pointer;user-select:none}
.chk input{accent-color:#111;width:16px;height:16px}
.count{font-size:13px;color:var(--faint);font-weight:600}

#list{overflow:auto;flex:1;min-height:0;padding:6px 8px 20px}
.item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-bottom-color:#eceee9;border-radius:9px;padding:10px 10px;cursor:pointer;margin-bottom:2px}
.item:hover{background:var(--panel2);border-color:var(--line)}
.item.sel{background:var(--sel);border-color:var(--khaki2)}
.item .t1{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;line-height:1.35;color:#111}
.item .t1 .pin{font-size:12px;color:var(--accent)}
.item .t2{font-size:13.5px;color:var(--dim);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .en{color:var(--faint);font-weight:400;font-size:13px}
.st{display:inline-flex;gap:4px;margin-left:auto}
.pill{font-size:12.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:#444;white-space:nowrap;font-weight:600}
.pill.me.done{border-color:var(--me);background:#e3f0fd;color:var(--me)}
.pill.pal.done{border-color:var(--pal);background:#fdeee2;color:var(--pal)}
.tag{font-size:11.5px;padding:0 6px;border-radius:4px;background:#fff3cf;color:var(--accent);border:1px solid #e3c66a;font-weight:600}
.empty{padding:30px 16px;text-align:center;color:var(--faint);line-height:1.6}

#detail{position:absolute;inset:0;background:var(--panel);display:none;flex-direction:column;min-height:0}
#detail.show{display:flex}
.dhead{padding:12px 16px;border-bottom:1px solid var(--line)}
.back{background:none;border:0;color:var(--me);cursor:pointer;padding:2px 0;font-size:15px;font-weight:600}
.dtitle{font-size:20px;font-weight:700;margin:6px 0 2px;line-height:1.3;color:#111}
.dsub{font-size:14px;color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta .m{font-size:13px;color:#222;background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
.donebar{display:flex;gap:8px;margin-top:12px}
.donebtn{flex:1;border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:9px;cursor:pointer;font-size:15px;color:#333;text-align:center;font-weight:600}
.donebtn.on.me{background:#e3f0fd;border-color:var(--me);color:var(--me);font-weight:700}
.donebtn.on.pal{background:#fdeee2;border-color:var(--pal);color:var(--pal);font-weight:700}
.dbody{overflow:auto;flex:1;min-height:0;padding:10px 12px 24px}
.sect{font-size:13px;color:var(--faint);letter-spacing:.05em;margin:12px 4px 6px;font-weight:700}
.obj{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 8px;border-radius:8px;border-bottom:1px solid #eceee9}
.obj:hover{background:var(--panel2)}
.obj.off{opacity:.6}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#111;border:2px solid #111}
.num.none{background:#e5e7e3!important;color:#666;border-color:transparent}
.otext{font-size:15px;line-height:1.5;color:#111}
.otext .sub{font-size:13px;color:var(--faint);margin-top:2px}
.otext .goto{background:none;border:0;color:var(--me);cursor:pointer;padding:0;font-size:13.5px;margin-top:4px;font-weight:600}
.ochk{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.ob{border:1.5px solid var(--line2);background:#fff;border-radius:6px;font-size:12.5px;padding:3px 8px;cursor:pointer;color:#444;white-space:nowrap;font-weight:600}
.ob.on.me{border-color:var(--me);color:var(--me);background:#e3f0fd}
.ob.on.pal{border-color:var(--pal);color:var(--pal);background:#fdeee2}
.obj.done-me .otext{text-decoration:line-through;text-decoration-color:#0006;color:#666}
.links a{color:var(--me);font-size:14px;font-weight:600}
.reqs{font-size:14px;color:#222;padding:0 4px;line-height:1.7}

.mapctl{position:absolute;top:12px;right:12px;z-index:600;background:rgba(255,255,255,.96);border:1px solid var(--line2);box-shadow:0 2px 10px #0002;border-radius:10px;padding:10px 12px;width:280px;display:flex;flex-direction:column;gap:9px}
.mapctl .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mapctl .lbl{font-size:14px;color:#111;font-weight:600}
.mapctl input[type=range]{width:100%;accent-color:#111}
.mapctl .seg button{padding:5px 10px;font-size:13.5px}
.mapctl .hint{font-size:12.5px;color:var(--warn);display:none;font-weight:600}
.mapnote{position:absolute;left:12px;bottom:12px;z-index:600;font-size:12.5px;color:#222;background:rgba(255,255,255,.92);border:1px solid var(--line);padding:5px 9px;border-radius:6px;max-width:60%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:#222}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid #000}
.toggleCtl{display:none}

.modal{position:fixed;inset:0;background:#0007;z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.card{background:#fff;border:1px solid var(--line2);border-radius:14px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:20px 20px 16px;box-shadow:0 10px 40px #0003}
.card h2{margin:0 0 6px;font-size:19px;color:#111}
.card p{margin:0 0 14px;color:#333;font-size:14px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:14px;color:#222;font-weight:600}
.field input{background:#fff;border:1.5px solid var(--line2);border-radius:8px;padding:10px 11px;color:#111;font:inherit;outline:none}
.field input:focus{border-color:#111}
.fr{display:flex;gap:8px}
.fr .field{flex:1;min-width:0}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{border:1.5px solid var(--line2);background:#fff;border-radius:8px;padding:9px 15px;cursor:pointer;font-size:14.5px;font-weight:600}
.btn.pri{background:#111;color:#fff;border-color:#111}
.testres{font-size:14px;margin-top:4px;min-height:18px;line-height:1.5;font-weight:600}

.leaflet-container{font-family:inherit;background:#e9ebe7}
.leaflet-tooltip{background:#fff;color:#111;border:1px solid var(--line2);box-shadow:0 2px 8px #0002;font-size:13.5px;padding:5px 9px;border-radius:6px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#111}
.leaflet-popup-content{margin:10px 12px;font-size:14.5px;line-height:1.5}
.leaflet-bar a{background:#fff;color:#111;border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:#f0f0ee}
.leaflet-control-attribution{display:none}
.opin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#111;border:2.5px solid #000;box-shadow:0 0 0 2px #fff,0 2px 6px #0008}
.opin.done{opacity:.45}
.opin.dia{border-radius:4px;transform:rotate(45deg);width:22px;height:22px}
.opin.dia b{transform:rotate(-45deg);font-size:12px}
.ext{font-size:12.5px;font-weight:700;white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;pointer-events:none}
.arealbl{font-size:13.5px;color:#fff;font-weight:700;white-space:nowrap;text-shadow:0 0 4px #000,0 0 3px #000,0 0 2px #000;pointer-events:none;letter-spacing:.02em}
.popsub{color:#444;font-size:13px;margin-top:3px}

@media (max-width: 900px){
  html,body{overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
  #app{grid-template-columns:1fr;grid-template-rows:1fr}
  #mapwrap{grid-row:1;grid-column:1}
  #panel{grid-row:1;grid-column:1;align-self:end;height:var(--sheet,55dvh);border-right:0;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px #0003;transition:height .22s ease}
  #panel.dragging{transition:none}
  .grab{display:flex!important}
  .hdr{padding:2px 12px 8px;touch-action:none}
  .brand h1{font-size:18px}
  .gear{padding:4px 9px;font-size:13px}
  .mapsel{margin-top:6px;display:inline-flex!important;vertical-align:middle;margin-right:6px}
  .mapsel .seg button{font-size:14px;padding:5px 13px}
  .who{margin-top:6px;display:inline-flex;vertical-align:middle;flex-wrap:nowrap}
  .who label{display:none}
  .who .seg button{padding:5px 11px}
  .sync{position:absolute;right:86px;top:9px;margin:0;font-size:12px}
  .hdr{position:relative}
  .src{display:none}
  .tools{padding:8px 12px;gap:6px}
  #list,.dbody,#detail{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #detail{overflow:auto}
  #detail .dbody{overflow:visible;flex:none}
  .mapctl{width:auto;left:10px;right:10px;top:10px;padding:8px 10px}
  .mapctl .more{display:none!important}
  .mapctl.open .more{display:flex!important}
  .toggleCtl{display:inline-block}
  .mapnote{display:none}
  .leaflet-bottom{bottom:calc(var(--sheet-px,55vh) + 6px)}
}
.grab{display:none;width:100%;height:22px;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:grab;touch-action:none}
.grab::before{content:"";width:52px;height:5px;border-radius:3px;background:#999}

.mapsel{display:flex;align-items:center;gap:8px;margin-top:10px}
.mapsel .seg button{font-size:15px;padding:6px 16px}
.detrow{display:none;align-items:center;justify-content:space-between;gap:8px}
.detrow.show{display:flex}
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <div id="map"></div>
    <div class="mapctl" id="mapctl">
      <div class="row">
        <span class="lbl">지도</span>
        <div class="seg" id="baseSeg">
          <button data-v="1">상세</button><button data-v="0.5">섞기</button><button data-v="0">최신</button>
        </div>
        <button class="ob toggleCtl" id="ctlMore">옵션</button>
      </div>
      <div class="detrow" id="detRow"><span class="lbl">상세지도</span><div class="seg" id="detSeg"></div></div>
      <div class="hint" id="naverHint">상세지도는 ⚙ 설정에서 GitHub 연결 후 보여</div>
      <div class="more" style="display:flex;flex-direction:column;gap:9px">
        <div><input type="range" id="blend" min="0" max="100" value="0" aria-label="상세지도 투명도"></div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="showExt" checked>탈출구</label>
          <label class="chk"><input type="checkbox" id="showAll" checked>남은 임무 전부</label>
        </div>
        <div class="legend"><span><i style="background:#3ad0ff"></i>PMC</span><span><i style="background:#ff9a3c"></i>스캐브</span><span><i style="background:#c47dff"></i>공용</span><span><i style="background:#fff"></i>지역이동</span></div>
      </div>
    </div>
    <div class="mapnote" id="mapnote"></div>
  </div>

  <aside id="panel">
    <button class="grab" id="grab" aria-label="패널 크기 전환"></button>
    <div class="hdr">
      <div class="brand"><h1>TARKOV OPS</h1><button class="gear" id="openSet">⚙ 설정</button></div>
      <div class="mapsel"><div class="seg" id="mapSeg"></div></div>
      <div class="who"><label>나는</label><div class="seg" id="whoSeg"><button data-v="siyoon">시윤</button><button data-v="sewon">세원</button></div><span class="sync" id="sync"></span></div>
      <div class="src" id="src">임무 데이터 불러오는 중…</div>
    </div>
    <div class="tools">
      <div class="search"><input id="q" type="search" placeholder="임무, 목표, 아이템 검색 (한글/영어)" autocomplete="off"><button class="x" id="qx" aria-label="지우기">✕</button></div>
      <div class="frow">
        <select id="fStatus"></select>
        <select id="fTrader"><option value="">모든 상인</option></select>
      </div>
      <div class="frow" style="justify-content:space-between;align-items:center">
        <label class="chk"><input type="checkbox" id="fPin">지도 위치 있는 임무만</label>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div id="list"><div class="empty">불러오는 중…</div></div>

    <section id="detail">
      <div class="dhead">
        <button class="back" id="back">← 목록</button>
        <div class="dtitle" id="dTitle"></div>
        <div class="dsub" id="dSub"></div>
        <div class="meta" id="dMeta"></div>
        <div class="donebar">
          <button class="donebtn" id="doneSiyoon" data-p="siyoon"></button>
          <button class="donebtn" id="doneSewon" data-p="sewon"></button>
        </div>
      </div>
      <div class="dbody" id="dBody"></div>
    </section>
  </aside>
</div>

<div class="modal" id="setModal">
  <div class="card">
    <h2>설정 · GitHub 동기화</h2>
    <p>완료 체크와 상세지도 이미지는 비공개 저장소에 보관돼. 토큰은 이 기기 브라우저에만 저장되고, 다른 곳으로는 보내지 않아.</p>
    <div class="fr">
      <div class="field"><label for="sOwner">GitHub 계정</label><input id="sOwner" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="sRepo">데이터 저장소</label><input id="sRepo" autocomplete="off" spellcheck="false"></div>
    </div>
    <div class="field"><label for="sToken">토큰 (github_pat_…)</label><input id="sToken" type="password" autocomplete="off" spellcheck="false" placeholder="비워두면 이 기기에만 저장"></div>
    <div class="testres" id="testRes"></div>
    <div class="btns">
      <button class="btn" id="setCancel">닫기</button>
      <button class="btn" id="setTest">연결 테스트</button>
      <button class="btn pri" id="setSave">저장</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
'use strict';
const PEOPLE = { siyoon: '시윤', sewon: '세원' };
const PAL = ['#ff5d5d','#ffb347','#ffe066','#7ee081','#5ec8ff','#b48bff','#ff7ad9','#4de3c8','#f4f4f4','#c0e05a'];
const TRADER_ORDER = ['프라퍼','테라피스트','펜스','스키어','피스키퍼','메카닉','래그맨','예거','등대지기','레프','BTR 조종수'];
const TRADER_COLOR = {'프라퍼':'#e8c15a','테라피스트':'#ff7a8a','펜스':'#9aa0a6','스키어':'#5ec8ff','피스키퍼':'#7ee081','메카닉':'#ffb347','래그맨':'#c49bff','예거':'#a3d977','등대지기':'#4de3c8','레프':'#ff9e6b','BTR 조종수':'#d4d4a0'};
const API = 'https://json.tarkov.dev/regular/';
const EXT_COLOR = {pmc:'#3ad0ff', scav:'#ff9a3c', both:'#9fe0b0', shared:'#c47dff', transit:'#ffffff'};

// ---- maps ----
// disp(x,z) = [sz*z, sx*x] is the north-up Leaflet position of a game coordinate.
// Each detail image: game (x,z) -> image pixel through a thin-plate spline fitted on extract pins,
// and px = bx*lng + bxo, py = by*lat + byo places the image in display space.
const MAPS = {
  woods: {

function tps(T, x, z){
  const gx = x/100, gz = z/100, a = T.a; let px = a[0][0] + a[1][0]*gx + a[2][0]*gz, py = a[0][1] + a[1][1]*gx + a[2][1]*gz;
  for (let i=0;i<T.c.length;i++){ const dx = gx-T.c[i][0], dz = gz-T.c[i][1]; const u = U(Math.sqrt(dx*dx+dz*dz)); px += u*T.w[i][0]; py += u*T.w[i][1]; }
  return [px, py];
}

function detBounds(d){

  return [[Math.min(latA,latB), Math.min(lngA,lngB)], [Math.max(latA,latB), Math.max(lngA,lngB)]];

function okOutline(z){

  const hasKo = s => /[가-힣]/.test(s || '');
  const tr = (d, k) => (d && d[k]) || k;
  const r1 = v => Math.round(v*10)/10;
  const traders = Object.values(TR.traders || TR);
  const trName = id => { const t = traders.find(t => t.id === id); return t ? tr(TRK, t.name) : id; };
  const tName = tt => hasKo(TK[tt.name]) ? TK[tt.name] : tr(TE, tt.name);
  const result = {};
  for (const mk of MAP_KEYS){
    const MID = MAPS[mk].id;
    const onMap = o => (o.maps||[]).includes(MID) || (o.zones||[]).some(z => z.map === MID) || (o.possibleLocations||[]).some(p => p.map === MID);
    const out = [];
    for (const t of tasks){
      if (!(t.map === MID || (t.objectives||[]).some(onMap))) continue;
      out.push({
        id: t.id, ko: hasKo(TK[t.name]) ? TK[t.name] : '', en: tr(TE, t.name), tr: trName(t.trader), lv: t.minPlayerLevel || 0,
        k: t.kappaRequired ? 1 : 0, lk: t.lightkeeperRequired ? 1 : 0, wiki: t.wikiLink || '',
        req: (t.taskRequirements||[]).map(q => q.task),
        o: (t.objectives||[]).map(o => {
          const d = { id:o.id, t:o.type, d: hasKo(TK[o.description]) ? TK[o.description] : tr(TE, o.description), w: onMap(o) ? 1 : 0 };
          if (o.optional) d.opt = 1; if (o.count > 1) d.n = o.count;
          const zs = (o.zones||[]).filter(z => z.map === MID);
          if (zs.length) d.z = zs.map(z => ({ p:[r1(z.position.x), r1(z.position.z)], ol:(z.outline||[]).map(p => [r1(p.x), r1(p.z)]) }));
          const pl = (o.possibleLocations||[]).filter(p => p.map === MID);
          if (pl.length) d.pl = pl.flatMap(p => p.positions.map(q => [r1(q.x), r1(q.z)]));
          if (o.questItem){ const q = qi[o.questItem] || {}; d.qi = q.name ? (hasKo(TK[q.name]) ? TK[q.name] : tr(TE, q.name)) : ''; }
          return d;
        })
      });
    }
    const reqNames = {};
    for (const t of out) for (const q of t.req){ const tt = T.tasks[q]; if (tt) reqNames[q] = tName(tt); }
    result[mk] = { tasks: out, reqNames };
  }
  if (!result.woods.tasks.length) throw new Error('no tasks');
  return result;
}
function applyData(){
  const d = DATA[mapKey];
  if (!d){ TASKS = []; byId = {}; $('count').textContent = ''; $('list').innerHTML = `<div class="empty">${esc(M.name)} 임무 데이터를 아직 못 불러왔어.<br>인터넷 연결을 확인하고 새로고침해줘.</div>`; $('src').textContent = dataLabel; return; }
  REQN = d.reqNames || {};
  const hasPin = t => t.o.some(o => o.w && ((o.z && o.z.length) || (o.pl && o.pl.length)));
  const norm2 = s => String(s||'').toLowerCase().replace(/\s+/g,'');
  TASKS = d.tasks.map(t => Object.assign({}, t, { _pin: hasPin(t), _s: norm2([t.ko, t.en, t.tr, ...t.o.map(o => o.d + ' ' + (o.qi||''))].join(' ')) }));
  TASKS.sort((a, b) => (b._pin - a._pin) || (TRADER_ORDER.indexOf(a.tr) - TRADER_ORDER.indexOf(b.tr)) || (a.lv - b.lv) || nameOf(a).localeCompare(nameOf(b), 'ko'));
  byId = {}; TASKS.forEach(t => byId[t.id] = t);
  const cur = $('fTrader').value;
  const traders = [...new Set(TASKS.map(t => t.tr))].sort((a,b) => TRADER_ORDER.indexOf(a) - TRADER_ORDER.indexOf(b));
  $('fTrader').innerHTML = '<option value="">모든 상인</option>' + traders.map(t => `<option>${esc(t)}</option>`).join('');
  $('fTrader').value = traders.includes(cur) ? cur : '';
  $('src').textContent = `${M.name} 임무 ${TASKS.length}개 · ${dataLabel}`;
  if (selected && !byId[selected]) closeTask(); else { renderList(); if (selected){ renderDetail(); drawTask(); } }
}
async function loadTasks(){
  const cache = LS.get('tk_cache2', null);
  if (cache && cache.data){ DATA = cache.data; dataLabel = `tarkov.dev ${fmtDate(cache.ts)} 기준 (갱신 중…)`; applyData(); }
  try {
    const data = await buildLive();
    LS.set('tk_cache2', { ts: Date.now(), data });
    DATA = data; dataLabel = `tarkov.dev 실시간 (${fmtDate(Date.now())})`; applyData();
  } catch(e){
    console.warn('live load failed', e);
    if (cache && cache.data){ dataLabel = `tarkov.dev ${fmtDate(cache.ts)} 저장본 (지금 연결 안 됨)`; applyData(); return; }
    try { const w = await (await fetch('woods_tasks.json')).json(); DATA = { woods: w }; dataLabel = '기본 저장본 (삼림만, 2026-11-18)'; applyData(); }
    catch(e2){ dataLabel = ''; applyData(); }
  }
}

function statusOptions(){

  const opts = [['all','전체 임무'],['meTodo','내가 안 한 것'],['palAhead',`${P}는 했고 나는 안 한 것`],['meAhead',`나는 했고 ${P}는 안 한 것`],['bothTodo','둘 다 안 한 것 (같이 하기)'],['anyTodo','둘 중 하나라도 안 한 것'],['bothDone','둘 다 완료']];
  const cur = $('fStatus').value || 'all';
  $('fStatus').innerHTML = opts.map(([v,l]) => `<option value="${v}">${esc(l)}</option>`).join('');
  $('fStatus').value = cur;
}
const norm = s => String(s||'').toLowerCase().replace(/\s+/g,'');
function filtered(){
  const q = norm($('q').value), st = $('fStatus').value, tr = $('fTrader').value, pinOnly = $('fPin').checked, P = pal();
  return TASKS.filter(t => {
    if (tr && t.tr !== tr) return false;
    if (pinOnly && !t._pin) return false;
    const a = tDone(me, t.id), b = tDone(P, t.id);
    if (st === 'meTodo' && a) return false;
    if (st === 'palAhead' && !(b && !a)) return false;
    if (st === 'meAhead' && !(a && !b)) return false;
    if (st === 'bothTodo' && (a || b)) return false;
    if (st === 'anyTodo' && a && b) return false;
    if (st === 'bothDone' && !(a && b)) return false;
    if (q && !t._s.includes(q)) return false;
    return true;
  });
}
function pills(t){

}

// ---- GitHub sync ----
// progress-<person>.json in the private data repo; local changes kept in `dirty` until pushed.
const ghOn = () => !!(cfg.token && cfg.owner && cfg.repo);
const ghUrl = path => `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path}`;
const ghHeaders = () => ({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' });
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')), c => c.charCodeAt(0)));
const b64enc = s => { const bytes = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); };
async function ghGet(p){
  const r = await fetch(ghUrl(`progress-${p}.json`), { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) return { sha: null, data: { tasks:{}, objs:{} } };
  if (!r.ok) throw Object.assign(new Error('get ' + r.status), { status: r.status });
  const j = await r.json(); let data = { tasks:{}, objs:{} };
  try { data = JSON.parse(b64dec(j.content)); } catch(e){}
  return { sha: j.sha, data: { tasks: data.tasks || {}, objs: data.objs || {} } };
}
async function ghPut(p, data, sha){
  const body = { message: `${PEOPLE[p]} 진행 상황 업데이트`, content: b64enc(JSON.stringify({ ...data, updated: new Date().toISOString() }, null, 1)) };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(`progress-${p}.json`), { method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw Object.assign(new Error('put ' + r.status), { status: r.status });
}
const isDirty = p => Object.keys(dirty[p].tasks).length + Object.keys(dirty[p].objs).length > 0;
let busy = false, pushTimer = null, lastOk = 0;
function setSync(txt, cls){ const s = $('sync'); s.textContent = txt; s.className = 'sync ' + (cls||''); }
function syncLabel(){
  if (!ghOn()) return setSync('이 기기에만 저장', 'local');
  if (Object.keys(PEOPLE).some(isDirty)) return setSync('저장 대기 중…', '');
  setSync(lastOk ? `동기화됨 ${fmtDate(lastOk).split(' ')[1]}` : '연결 중…', lastOk ? 'ok' : '');
}
async function syncNow(){
  if (!ghOn() || busy) return;
  busy = true;
  try {
    for (const p of Object.keys(PEOPLE)){
      for (let attempt = 0; attempt < 3; attempt++){
        const remote = await ghGet(p);
        if (!isDirty(p)){ store[p] = { tasks: { ...remote.data.tasks }, objs: { ...remote.data.objs } }; break; }
        const sent = { tasks: { ...dirty[p].tasks }, objs: { ...dirty[p].objs } };
        const merged = { tasks: { ...remote.data.tasks, ...sent.tasks }, objs: { ...remote.data.objs, ...sent.objs } };
        try {
          await ghPut(p, merged, remote.sha);
          for (const k of ['tasks','objs']) for (const id in sent[k]) if (dirty[p][k][id] === sent[k][id]) delete dirty[p][k][id];
          store[p] = { tasks: { ...merged.tasks, ...dirty[p].tasks }, objs: { ...merged.objs, ...dirty[p].objs } };
          break;
        } catch(err){ if (err.status === 409 || err.status === 422) continue; throw err; }
      }
    }
    lastOk = Date.now();
    LS.set('tk_progress', store); LS.set('tk_dirty', dirty);
    syncLabel(); refreshAfterChange();
  } catch(err){
    console.warn('sync failed', err);
    const st = err.status;
    setSync(st === 401 ? '토큰 오류 · ⚙ 설정 확인' : st === 404 ? '저장소를 못 찾음 · ⚙ 설정 확인' : st === 403 ? '권한 부족 · 토큰 권한 확인' : '오프라인 · 나중에 저장', st ? 'bad' : 'local');
  } finally { busy = false; }
}
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 1200); syncLabel(); }
function toggle(p, kind, id){
  const v = !store[p][kind][id];
  store[p][kind][id] = v; dirty[p][kind][id] = v;
  LS.set('tk_progress', store); LS.set('tk_dirty', dirty);
  refreshAfterChange();
  if (ghOn()) schedulePush(); else { for (const k of ['tasks','objs']) dirty[p][k] = {}; LS.set('tk_dirty', dirty); syncLabel(); }
}
function refreshAfterChange(){ renderList(); if (selected){ renderDetail(); drawTask(); } }
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', syncNow);

// ---- settings ----
function openSettings(){ $('sOwner').value = cfg.owner; $('sRepo').value = cfg.repo; $('sToken').value = cfg.token; $('testRes').textContent = ''; $('setModal').classList.add('show'); }
function closeSettings(){ $('setModal').classList.remove('show'); }
$('openSet').addEventListener('click', openSettings);
$('setCancel').addEventListener('click', closeSettings);
$('setModal').addEventListener('click', e => { if (e.target.id === 'setModal') closeSettings(); });
async function testConn(owner, repo, token){
  const h = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
  const base = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
  const r = await fetch(base, { headers: h, cache: 'no-store' });
  if (r.status === 401) return ['토큰이 맞지 않아. 다시 복사해서 넣어줘.', 'var(--bad)'];
  if (r.status === 404) return ['저장소를 못 찾았어. 계정/저장소 이름이나 토큰의 저장소 권한을 확인해줘.', 'var(--bad)'];
  if (!r.ok) return [`GitHub 응답 오류 (${r.status})`, 'var(--bad)'];
  const j = await r.json();
  if (j.permissions && !j.permissions.push) return ['읽기만 가능한 토큰이야. Contents 권한을 Read and write로 해줘.', 'var(--warn)'];
  const files = [...new Set(MAP_KEYS.flatMap(k => MAPS[k].details.map(d => d.file)))];
  const missing = [];
  for (const f of files){ const x = await fetch(`${base}/contents/${f}`, { headers: h, cache:'no-store' }); if (!x.ok) missing.push(f); }
  return missing.length ? [`연결 성공 · 단, 저장소에 없는 지도 파일: ${missing.join(', ')}`, 'var(--warn)'] : ['연결 성공 · 상세지도 파일도 전부 찾았어.', 'var(--ok)'];
}
$('setTest').addEventListener('click', async () => {
  const o = $('sOwner').value.trim(), r = $('sRepo').value.trim(), t = $('sToken').value.trim();
  if (!t){ $('testRes').innerHTML = '<span style="color:var(--warn)">토큰을 넣어줘.</span>'; return; }
  $('testRes').textContent = '확인 중…';
  try { const [msg, col] = await testConn(o, r, t); $('testRes').innerHTML = `<span style="color:${col}">${esc(msg)}</span>`; }
  catch(e){ $('testRes').innerHTML = '<span style="color:var(--bad)">GitHub에 연결하지 못했어. 인터넷 연결을 확인해줘.</span>'; }
});
$('setSave').addEventListener('click', async () => {
  cfg.owner = $('sOwner').value.trim(); cfg.repo = $('sRepo').value.trim(); cfg.token = $('sToken').value.trim();
  LS.set('tk_gh', cfg); closeSettings(); lastOk = 0; syncLabel();

});

// ---- who ----
function setMe(p){
  me = p; LS.set('tk_me', p);
  document.querySelectorAll('#whoSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === p));
  statusOptions(); refreshAfterChange();

// ---- mobile bottom sheet: drag the handle or the header up/down ----
const panelEl = $('panel');
const isMobile = () => innerWidth <= 900;
const SNAPS = [0.24, 0.5, 0.9];
let sheetFrac = LS.get('tk_sheet', 0.5);
function setSheetPx(px, save){
  const h = Math.max(innerHeight*0.16, Math.min(innerHeight*0.92, px));
  document.documentElement.style.setProperty('--sheet', h + 'px');
  document.documentElement.style.setProperty('--sheet-px', h + 'px');
  if (save){ sheetFrac = h / innerHeight; LS.set('tk_sheet', sheetFrac); }
}
function setSheet(frac){ setSheetPx(innerHeight*frac, true); }
setSheetPx(innerHeight*sheetFrac);
addEventListener('resize', () => setSheetPx(innerHeight*sheetFrac));
let drag = null, justDragged = false;
function sheetDown(e){
  if (!isMobile() || e.target.closest('input,select,textarea')) return;
  drag = { y: e.clientY, h: panelEl.getBoundingClientRect().height, moved: false, onGrab: !!e.target.closest('#grab') };
}
$('grab').addEventListener('pointerdown', sheetDown);
document.querySelector('.hdr').addEventListener('pointerdown', sheetDown);
addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dy) < 8) return;
  if (!drag.moved){ drag.moved = true; panelEl.classList.add('dragging'); }
  setSheetPx(drag.h - dy);
  e.preventDefault();
}, { passive: false });
function sheetUp(){
  if (!drag) return;
  const d = drag; drag = null; panelEl.classList.remove('dragging');
  if (d.moved){
    const f = panelEl.getBoundingClientRect().height / innerHeight;
    setSheet(SNAPS.reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a));
    justDragged = true; setTimeout(() => justDragged = false, 300);
  } else if (d.onGrab){
    const i = SNAPS.findIndex(x => Math.abs(x - sheetFrac) < 0.05);
    setSheet(SNAPS[(i + 1) % SNAPS.length]);
  }
}
addEventListener('pointerup', sheetUp); addEventListener('pointercancel', sheetUp);
panelEl.addEventListener('click', e => { if (justDragged){ e.stopPropagation(); e.preventDefault(); } }, true);

// map padding so fitted views land in the part of the map not covered by the sheet / controls
function mapPad(){
  if (!isMobile()) return { paddingTopLeft:[20, 20], paddingBottomRight:[20, 20] };
  const sheet = panelEl.getBoundingClientRect().height, ctl = $('mapctl').getBoundingClientRect().height;
  return { paddingTopLeft:[12, ctl + 18], paddingBottomRight:[12, sheet + 12] };
}
function fitView(bounds, opts){ map.fitBounds(bounds, Object.assign(mapPad(), opts || {})); }
// keep the header (map / person pickers) visible above the task detail
const hdrEl = document.querySelector('.hdr');
new ResizeObserver(() => { $('detail').style.top = (hdrEl.offsetTop + hdrEl.offsetHeight) + 'px'; }).observe(hdrEl);

// ---- boot ----
setMe(me); syncLabel();
setMap(mapKey);
loadTasks();
syncNow();
if (!LS.get('tk_seen', false) && !cfg.token){ LS.set('tk_seen', true); setTimeout(openSettings, 600); }
})();
